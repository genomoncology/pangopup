[package]
name = "pangopup-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
service-test-fixtures = ["pangopup-assets/test-fixtures"]

[[bin]]
name = "pangopup"
path = "src/main.rs"

[dependencies]
pangopup-assets = { path = "../pangopup-assets" }
pangopup-cache = { path = "../pangopup-cache" }
pangopup-core = { path = "../pangopup-core" }
pangopup-engine = { path = "../pangopup-engine" }
pangopup-index = { path = "../pangopup-index" }
pangopup-model = { path = "../pangopup-model" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
axum = { version = "0.8.6", features = ["json"] }
crossbeam-channel = "0.5.15"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
libc = "0.2.188"
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
tower = { version = "0.5.2", features = ["util"] }

[[bench]]
name = "snv_lookup"
harness = false

[[bench]]
name = "snv_regression"
harness = false

[lints]
workspace = true
