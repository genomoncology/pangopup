name: publish-container
run-name: publish-container ${{ inputs.mode }} ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Stage private native leaves or finalize the public manifest
        required: true
        type: choice
        options:
          - stage
          - finalize
      commit:
        description: Exact lowercase 40-character current main commit
        required: true
        type: string
      stage_run_id:
        description: Exact successful stage run ID (required only for finalize)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pangopup-container-publication
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/genomoncology/pangopup
  VERSION: 0.2.0

jobs:
  preflight-stage:
    if: inputs.mode == 'stage'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Authenticate exact stage source and absent version tags
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$EVENT_SHA" = "$EXACT_COMMIT"
          test "$WORKFLOW_SHA" = "$EXACT_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_COMMIT"
          git diff --quiet --
          git diff --cached --quiet --
          test -z "${{ inputs.stage_run_id }}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          registry_token=$(curl -fsS --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:genomoncology/pangopup:pull' | jq -er .token)
          assert_tag_absent() {
            local tag=$1
            local code
            code=$(curl -sS -o "$RUNNER_TEMP/tag-$tag.json" -w '%{http_code}' \
              -H "Authorization: Bearer $registry_token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/genomoncology/pangopup/manifests/$tag")
            scripts/require-container-tag-absent.sh "$tag" "$code" \
              "$RUNNER_TEMP/tag-$tag.json"
          }
          for tag in "$VERSION" "v$VERSION"; do
            assert_tag_absent "$tag"
          done
          docker logout ghcr.io

  stage-leaf:
    if: inputs.mode == 'stage'
    needs: preflight-stage
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            native_machine: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            native_machine: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Authenticate exact native source
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$EVENT_SHA" = "$EXACT_COMMIT"
          test "$WORKFLOW_SHA" = "$EXACT_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_COMMIT"
          git diff --quiet --
          git diff --cached --quiet --
          test "$(uname -m)" = "${{ matrix.native_machine }}"
          test -z "${{ inputs.stage_run_id }}"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
        id: buildx
        with:
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:87afb62ed6a762bb65b85d53819f3b341fb74a36d1fc0a1153a64f367637bfda
      - name: Authenticate digest-capable native builder
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          test -n "$BUILDER"
          docker buildx inspect "$BUILDER" --bootstrap >"$RUNNER_TEMP/buildx-inspect.txt"
          grep -Eq '^Driver:[[:space:]]+docker-container$' "$RUNNER_TEMP/buildx-inspect.txt"
      - name: Build native helper
        run: cargo build --locked --package pangopup-build
      - name: Push and hold exact unattested native leaf by digest
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
          ARCHITECTURE: ${{ matrix.architecture }}
          BUILDER: ${{ steps.buildx.outputs.name }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --builder "$BUILDER" --pull --provenance=false --sbom=false \
            --platform "linux/$ARCHITECTURE" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true" \
            --metadata-file "$RUNNER_TEMP/leaf-metadata.json" \
            --build-arg PANGOPUP_REVISION="$EXACT_COMMIT" \
            --build-arg PANGOPUP_VERSION="$VERSION" .
          digest=$(jq -er '."containerimage.digest" // ."containerimage.descriptor".digest' \
            "$RUNNER_TEMP/leaf-metadata.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" >"$RUNNER_TEMP/leaf-digest.txt"
      - name: Qualify held private leaf
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          digest=$(cat "$RUNNER_TEMP/leaf-digest.txt")
          docker pull "$IMAGE@$digest"
          scripts/qualify-container.sh "$IMAGE@$digest" "$GITHUB_WORKSPACE" \
            target/debug/pangopup-build "$RUNNER_TEMP/pangopup-container-stage" "$digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pangopup-container-leaf-${{ matrix.architecture }}-${{ inputs.commit }}-${{ github.run_id }}
          path: ${{ runner.temp }}/leaf-digest.txt
          if-no-files-found: error
          retention-days: 7

  aggregate-stage-receipt:
    if: inputs.mode == 'stage'
    needs: stage-leaf
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Authenticate exact receipt source
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$EVENT_SHA" = "$EXACT_COMMIT"
          test "$WORKFLOW_SHA" = "$EXACT_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_COMMIT"
          git diff --quiet --
          git diff --cached --quiet --
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pangopup-container-leaf-*-${{ inputs.commit }}-${{ github.run_id }}
          path: ${{ runner.temp }}/leaves
      - name: Create canonical two-leaf stage receipt
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$RUNNER_TEMP/leaves" -type f -name leaf-digest.txt -print | sort)
          test "${#files[@]}" = 2
          test "$(find "$RUNNER_TEMP/leaves" -type f | wc -l)" = 2
          mapfile -t amd64_files < <(find "$RUNNER_TEMP/leaves" -path '*leaf-amd64-*' -type f -name leaf-digest.txt -print)
          mapfile -t arm64_files < <(find "$RUNNER_TEMP/leaves" -path '*leaf-arm64-*' -type f -name leaf-digest.txt -print)
          test "${#amd64_files[@]}" = 1
          test "${#arm64_files[@]}" = 1
          amd64=$(cat "${amd64_files[0]}")
          arm64=$(cat "${arm64_files[0]}")
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$amd64" != "$arm64"
          jq -cnS --arg commit "$EXACT_COMMIT" --arg workflow_sha "$WORKFLOW_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" --arg amd64 "$amd64" --arg arm64 "$arm64" \
            '{amd64:$amd64,arm64:$arm64,commit:$commit,mode:"stage",run_id:$run_id,schema:"pangopup-container-stage-v1",workflow_sha:$workflow_sha}' \
            >"$RUNNER_TEMP/stage-receipt.json"
          test "$(jq -cS . "$RUNNER_TEMP/stage-receipt.json")" = "$(cat "$RUNNER_TEMP/stage-receipt.json")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pangopup-container-stage-${{ inputs.commit }}-${{ github.run_id }}
          path: ${{ runner.temp }}/stage-receipt.json
          if-no-files-found: error
          retention-days: 7

  load-stage-receipt:
    if: inputs.mode == 'finalize'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Authenticate exact finalize source and stage run
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          STAGE_RUN_ID: ${{ inputs.stage_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STAGE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$EVENT_SHA" = "$EXACT_COMMIT"
          test "$WORKFLOW_SHA" = "$EXACT_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_COMMIT"
          git diff --quiet --
          git diff --cached --quiet --
          gh api -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID" >"$RUNNER_TEMP/stage-run.json"
          jq -e --arg commit "$EXACT_COMMIT" \
            '.id > 0 and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $commit and .path == ".github/workflows/publish-container.yml"' \
            "$RUNNER_TEMP/stage-run.json" >/dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' --paginate \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[]' | jq -s '.' >"$RUNNER_TEMP/stage-jobs.json"
          jq -e '([.[] | select(.name == "preflight-stage" and .conclusion == "success")] | length) == 1 and ([.[] | select(.name | startswith("stage-leaf (")) | select(.conclusion == "success")] | length) == 2 and ([.[] | select(.name == "aggregate-stage-receipt" and .conclusion == "success")] | length) == 1' \
            "$RUNNER_TEMP/stage-jobs.json" >/dev/null
      - name: Download and authenticate the unique retained receipt
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          STAGE_RUN_ID: ${{ inputs.stage_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="pangopup-container-stage-$EXACT_COMMIT-$STAGE_RUN_ID"
          gh api -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' --paginate \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[]' | jq -s '.' >"$RUNNER_TEMP/artifacts.json"
          IFS=$'\t' read -r artifact_id artifact_digest < <(
            scripts/admit-container-stage-receipt.sh metadata \
              "$RUNNER_TEMP/artifacts.json" "$name"
          )
          gh api -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" >"$RUNNER_TEMP/receipt.zip"
          test "$artifact_digest" = "sha256:$(sha256sum "$RUNNER_TEMP/receipt.zip" | cut -d' ' -f1)"
          scripts/admit-container-stage-receipt.sh archive \
            "$RUNNER_TEMP/artifacts.json" "$name" "$RUNNER_TEMP/receipt.zip" \
            "$EXACT_COMMIT" "$WORKFLOW_SHA" "$STAGE_RUN_ID" \
            "$RUNNER_TEMP/stage-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pangopup-container-finalize-receipt-${{ inputs.commit }}-${{ github.run_id }}
          path: ${{ runner.temp }}/stage-receipt.json
          if-no-files-found: error
          retention-days: 1

  qualify-public-leaf:
    if: inputs.mode == 'finalize'
    needs: load-stage-receipt
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            native_machine: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            native_machine: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Authenticate exact anonymous qualification source
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$EVENT_SHA" = "$EXACT_COMMIT"
          test "$WORKFLOW_SHA" = "$EXACT_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_COMMIT"
          git diff --quiet --
          git diff --cached --quiet --
          test "$(uname -m)" = "${{ matrix.native_machine }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pangopup-container-finalize-receipt-${{ inputs.commit }}-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt
      - name: Qualify exact public leaf anonymously
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/receipt" -mindepth 1 -maxdepth 1 | wc -l)" = 1
          receipt="$RUNNER_TEMP/receipt/stage-receipt.json"
          test -f "$receipt"
          digest=$(jq -er --arg architecture "$ARCHITECTURE" '.[$architecture]' "$receipt")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$IMAGE@$digest"
          cargo build --locked --package pangopup-build
          scripts/qualify-container.sh "$IMAGE@$digest" "$GITHUB_WORKSPACE" \
            target/debug/pangopup-build "$RUNNER_TEMP/pangopup-container-public" "$digest"

  finalize-manifest:
    if: inputs.mode == 'finalize'
    needs: [load-stage-receipt, qualify-public-leaf]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Authenticate exact manifest source
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$EVENT_SHA" = "$EXACT_COMMIT"
          test "$WORKFLOW_SHA" = "$EXACT_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXACT_COMMIT"
          git diff --quiet --
          git diff --cached --quiet --
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pangopup-container-finalize-receipt-${{ inputs.commit }}-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt
      - name: Recheck tag absence, inspect leaves, and publish held manifest
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/receipt" -mindepth 1 -maxdepth 1 | wc -l)" = 1
          receipt="$RUNNER_TEMP/receipt/stage-receipt.json"
          test -f "$receipt"
          amd64=$(jq -er '.amd64' "$receipt")
          arm64=$(jq -er '.arm64' "$receipt")
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$amd64" != "$arm64"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          registry_token=$(curl -fsS --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:genomoncology/pangopup:pull' | jq -er .token)
          assert_tag_absent() {
            local tag=$1
            local code
            code=$(curl -sS -o "$RUNNER_TEMP/final-tag-$tag.json" -w '%{http_code}' \
              -H "Authorization: Bearer $registry_token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/genomoncology/pangopup/manifests/$tag")
            scripts/require-container-tag-absent.sh "$tag" "$code" \
              "$RUNNER_TEMP/final-tag-$tag.json"
          }
          for pair in "amd64:$amd64" "arm64:$arm64"; do
            architecture=${pair%%:*}
            digest=${pair#*:}
            docker pull "$IMAGE@$digest"
            test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE@$digest")" = "$architecture"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$digest")" = "$EXACT_COMMIT"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE@$digest")" = "$VERSION"
          done
          for tag in "$VERSION" "v$VERSION"; do
            assert_tag_absent "$tag"
          done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/genomoncology/pangopup" \
            --annotation "index:org.opencontainers.image.revision=$EXACT_COMMIT" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.licenses=GPL-3.0-only" \
            --metadata-file "$RUNNER_TEMP/index-metadata.json" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:v$VERSION" --tag "$IMAGE:latest" \
            "$IMAGE@$amd64" "$IMAGE@$arm64"
          index_digest=$(jq -er '."containerimage.descriptor".digest' \
            "$RUNNER_TEMP/index-metadata.json")
          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(jq -er '."containerimage.descriptor".mediaType' \
            "$RUNNER_TEMP/index-metadata.json")" = application/vnd.oci.image.index.v1+json
          printf '%s\n' "$index_digest" >"$RUNNER_TEMP/index-digest.txt"
      - name: Verify final public index and tags anonymously
        run: |
          set -euo pipefail
          index_digest=$(cat "$RUNNER_TEMP/index-digest.txt")
          docker logout ghcr.io
          raw=$(docker buildx imagetools inspect --raw "$IMAGE@$index_digest")
          test "$(jq -r .mediaType <<<"$raw")" = application/vnd.oci.image.index.v1+json
          test "$(jq -r '.annotations."org.opencontainers.image.source"' <<<"$raw")" = https://github.com/genomoncology/pangopup
          test "$(jq -r '.annotations."org.opencontainers.image.revision"' <<<"$raw")" = "${{ inputs.commit }}"
          test "$(jq -r '.annotations."org.opencontainers.image.version"' <<<"$raw")" = "$VERSION"
          test "$(jq -r '.annotations."org.opencontainers.image.licenses"' <<<"$raw")" = GPL-3.0-only
          test "$(jq '.manifests | length' <<<"$raw")" = 2
          test "$(jq '[.manifests[].platform | (.os + "/" + .architecture)] | sort == ["linux/amd64","linux/arm64"]' <<<"$raw")" = true
          receipt="$RUNNER_TEMP/receipt/stage-receipt.json"
          amd64=$(jq -er '.amd64' "$receipt")
          arm64=$(jq -er '.arm64' "$receipt")
          test "$(jq --arg amd64 "$amd64" --arg arm64 "$arm64" '[.manifests[].digest] | sort == ([$amd64,$arm64] | sort)' <<<"$raw")" = true
          for tag in "$VERSION" "v$VERSION" latest; do
            resolved=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest.Digest}}' | jq -er '.')
            test "$resolved" = "$index_digest"
          done
          docker pull "$IMAGE@$index_digest"
          docker pull "$IMAGE:$VERSION"
          printf 'published %s@%s amd64=%s arm64=%s\n' "$IMAGE" "$index_digest" "$amd64" "$arm64"
