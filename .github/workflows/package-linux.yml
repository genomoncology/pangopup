name: package-linux

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact lowercase 40-character commit reachable from main
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Authenticate exact checkout
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$EXACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXACT_COMMIT" origin/main
          git diff --quiet --
          git diff --cached --quiet --
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          toolchain=$(sed -nE 's/^channel = "([^"]+)"$/\1/p' rust-toolchain.toml)
          profile=$(sed -nE 's/^profile = "([^"]+)"$/\1/p' rust-toolchain.toml)
          components=$(sed -nE 's/^components = \[(.*)\]$/\1/p' rust-toolchain.toml | tr -d '",')
          install=(rustup toolchain install "$toolchain" --profile "$profile")
          for component in $components; do install+=(--component "$component"); done
          "${install[@]}"
          rustup override set "$toolchain"
          test "$(rustc --version | awk '{print $2}')" = 1.93.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.0"
      - name: Build release executables and SBOM tool
        run: |
          set -euo pipefail
          cargo build --locked --release --package pangopup-cli --package pangopup-build
          cargo install --locked --version 0.5.9 cargo-cyclonedx
          test "$(cargo cyclonedx --version | awk '{print $2}')" = 0.5.9
      - name: Generate deterministic untouched SBOM
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          scratch=/tmp/pangopup-cyclonedx-source-v1
          [[ ! -e "$scratch" && ! -L "$scratch" ]]
          owned=0
          cleanup() { if ((owned)); then rm -rf -- "$scratch"; fi; }
          trap cleanup EXIT
          epoch=$(git show -s --format=%ct "$EXACT_COMMIT")
          for round in one two; do
            umask 077
            mkdir "$scratch"
            owned=1
            test "$(stat -c %a "$scratch")" = 700
            git archive "$EXACT_COMMIT" | tar -x -C "$scratch"
            (cd "$scratch" && SOURCE_DATE_EPOCH="$epoch" CARGO_NET_OFFLINE=true cargo cyclonedx --manifest-path crates/pangopup-cli/Cargo.toml --target x86_64-unknown-linux-gnu --format json --describe binaries --quiet)
            cp "$scratch/crates/pangopup-cli/pangopup_bin.cdx.json" "$RUNNER_TEMP/pangopup-$round.cdx.json"
            rm -rf -- "$scratch"
            owned=0
          done
          cmp "$RUNNER_TEMP/pangopup-one.cdx.json" "$RUNNER_TEMP/pangopup-two.cdx.json"
      - name: Prepare exact release files
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -1)
          target/release/pangopup-build executable-release prepare \
            --executable target/release/pangopup \
            --sbom "$RUNNER_TEMP/pangopup-one.cdx.json" \
            --version "$version" --target-commit "$EXACT_COMMIT" \
            --repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/release"
      - name: Qualify final executable and inventory
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -1)
          scripts/qualify-linux-release.sh "$release" "$version" "$EXACT_COMMIT"
      - name: Smoke in pinned clean container
        run: |
          set -euo pipefail
          image='ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90'
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v "$RUNNER_TEMP/release:/release:ro" -v "$GITHUB_WORKSPACE:/source:ro" "$image" bash -ceu '
              /source/scripts/smoke-linux-release.sh /release/pangopup-linux-x86_64 /source /tmp/data /tmp/pangopup-smoke-cache
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pangopup-linux-${{ inputs.commit }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7
