name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(sed -nE 's/^channel = "([^"]+)"$/\1/p' rust-toolchain.toml)
          profile=$(sed -nE 's/^profile = "([^"]+)"$/\1/p' rust-toolchain.toml)
          components=$(sed -nE 's/^components = \[(.*)\]$/\1/p' rust-toolchain.toml | tr -d '",')
          install=(rustup toolchain install "$toolchain" --profile "$profile")
          for component in $components; do
            install+=(--component "$component")
          done
          "${install[@]}"
          rustup override set "$toolchain"
          rustup show active-toolchain
      - name: Install uv 0.8.0
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.0"
      - name: Install authenticated mustmatch 0.1.0
        run: |
          wheel=mustmatch-0.1.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          curl --fail --location --silent --show-error \
            --output "$wheel" \
            "https://github.com/genomoncology/mustmatch/releases/download/v0.1.0/$wheel"
          test "$(stat --format=%s "$wheel")" -eq 1469293
          echo "86c6c250578413009eed9ff591d5fa3107c9695176d418dbfc2ccae87d472e77  $wheel" \
            | sha256sum --check --strict
          uv tool install "$wheel"
          mustmatch --version
      - name: Install authenticated cargo-deny 0.19.4
        run: |
          archive=cargo-deny-0.19.4-x86_64-unknown-linux-musl.tar.gz
          directory=cargo-deny-0.19.4-x86_64-unknown-linux-musl
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.4/$archive"
          test "$(stat --format=%s "$archive")" -eq 4965853
          echo "3bd58b784e83715b86ddbc9deac591890372ec77fda5741bb0826970b958506f  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive"
          install -m 0755 "$directory/cargo-deny" "$HOME/.local/bin/cargo-deny"
          cargo deny --version
      - name: Install ripgrep 15.2.0
        run: |
          archive=ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/$archive"
          echo "33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive"
          install -m 0755 ripgrep-15.2.0-x86_64-unknown-linux-musl/rg "$HOME/.local/bin/rg"
          rg --version
      - run: make lint
      - run: make test
      - run: make spec
